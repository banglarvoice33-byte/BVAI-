services:
    - type: web
    name: BVAI-
    env: docker
    plan: free
    rootDir: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
            - key: NODE_ENV
        value: production
            - key: VIDEO_PUBLISH_MODE
        value: distribute
            - key: VIDEO_DELIVERY_ENABLED
        value: "true"
            - key: VIDEO_DELIVERY_PLATFORMS
        value: youtube
            - key: SUPABASE_URL
        sync: false
            - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
            - key: YOUTUBE_CHANNEL_ID
        sync: false
