name: BVAI Video Ops Healthcheck

# Manual only. Prints configuration readiness WITHOUT secret values.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Report vars + secret presence (boolean only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VIDEO_AUTOMATION_PAUSED: ${{ vars.VIDEO_AUTOMATION_PAUSED || secrets.VIDEO_AUTOMATION_PAUSED }}
          ENABLE_VIDEO_AUTOMATION: ${{ vars.ENABLE_VIDEO_AUTOMATION || secrets.ENABLE_VIDEO_AUTOMATION }}
          BVAI_VIDEO_SCHEDULER_OWNER: ${{ vars.BVAI_VIDEO_SCHEDULER_OWNER || secrets.BVAI_VIDEO_SCHEDULER_OWNER }}
          VIDEO_DELIVERY_ENABLED: ${{ vars.VIDEO_DELIVERY_ENABLED || secrets.VIDEO_DELIVERY_ENABLED }}
          VIDEO_DELIVERY_PLATFORMS: ${{ vars.VIDEO_DELIVERY_PLATFORMS || secrets.VIDEO_DELIVERY_PLATFORMS }}
          VIDEO_PUBLISH_MODE: ${{ vars.VIDEO_PUBLISH_MODE || secrets.VIDEO_PUBLISH_MODE }}
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID || secrets.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -euo pipefail
          present() { [ -n "${1:-}" ] && echo set || echo MISSING; }
          echo "=== Effective config (secrets masked; channel shows presence only) ==="
          echo "VIDEO_AUTOMATION_PAUSED=${VIDEO_AUTOMATION_PAUSED:-}"
          echo "ENABLE_VIDEO_AUTOMATION=${ENABLE_VIDEO_AUTOMATION:-}"
          echo "BVAI_VIDEO_SCHEDULER_OWNER=${BVAI_VIDEO_SCHEDULER_OWNER:-}"
          echo "VIDEO_DELIVERY_ENABLED=${VIDEO_DELIVERY_ENABLED:-}"
          echo "VIDEO_DELIVERY_PLATFORMS=${VIDEO_DELIVERY_PLATFORMS:-}"
          echo "VIDEO_PUBLISH_MODE=${VIDEO_PUBLISH_MODE:-}"
          echo "YOUTUBE_CHANNEL_ID=$(present "$YOUTUBE_CHANNEL_ID")"
          echo "=== Secrets (presence only) ==="
          echo "SUPABASE_URL=$(present "$SUPABASE_URL")"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(present "$SUPABASE_SERVICE_ROLE_KEY")"
          echo "YOUTUBE_REFRESH_TOKEN=$(present "$YOUTUBE_REFRESH_TOKEN")"
          echo "OAUTH_CLIENT_ID=$(present "$OAUTH_CLIENT_ID")"
          echo "OAUTH_CLIENT_SECRET=$(present "$OAUTH_CLIENT_SECRET")"
          echo "PIXABAY_API_KEY=$(present "$PIXABAY_API_KEY")"
          echo "PEXELS_API_KEY=$(present "$PEXELS_API_KEY")"
          echo "=== deliveryTargets() ==="
          node scripts/pipeline/check-delivery-config.mjs || true
          echo "=== Supabase probes ==="
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::Supabase secrets missing"
            exit 1
          fi
          due=$(curl -fsS --max-time 20 -X POST "$SUPABASE_URL/rest/v1/rpc/video_job_due" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H 'Content-Type: application/json' -d '{}' || echo 'RPC_FAILED')
          echo "video_job_due=$due"
          outbox=$(curl -fsS --max-time 20 -G "$SUPABASE_URL/rest/v1/video_delivery_outbox" \
            --data-urlencode "select=id,platform,status,created_at" \
            --data-urlencode "order=created_at.desc" \
            --data-urlencode "limit=5" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" || echo 'OUTBOX_FAILED')
          echo "outbox_recent=$outbox"
          jobs=$(curl -fsS --max-time 20 -G "$SUPABASE_URL/rest/v1/video_generation_jobs" \
            --data-urlencode "select=id,status,created_at,error_message" \
            --data-urlencode "order=created_at.desc" \
            --data-urlencode "limit=5" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" || echo 'JOBS_FAILED')
          echo "recent_jobs=$jobs"
