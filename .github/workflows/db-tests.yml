name: db-tests
on: [push, pull_request]
jobs:
  pgTAP:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: supabase db start
      - run: supabase test db
      - run: supabase stop --no-backup
