name: BVAI Article Video Pipeline

on:
  workflow_dispatch:
    inputs:
      article_id:
        description: "Optional published article UUID; blank selects the latest eligible article"
        required: false
        type: string
  schedule:
    # Once daily, 12-minute timeout: at most ~360 runner minutes in a 30-day month.
    - cron: "0 3 * * *"

concurrency:
  group: bvai-video-render
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check required protected secrets without printing values
        id: check
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          API_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          if [[ -n "$DB_URL" && -n "$API_URL" && -n "$SERVICE_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Video pipeline skipped: required GitHub Actions secrets are not all configured."
          fi

  render-and-upload:
    needs: preflight
    if: ${{ needs.preflight.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VIDEO_UPLOAD_TOKEN: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      ARTICLE_ID: ${{ inputs.article_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate production target
        shell: bash
        run: |
          set -euo pipefail
          test "${SUPABASE_URL%/}" = "https://rtejxeamxeycnpcwnseo.supabase.co" || {
            echo "::error::SUPABASE_URL does not target the configured BVAI production project"
            exit 1
          }

      - name: Install Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install FFmpeg and Bengali fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core fonts-beng librsvg2-bin
          sudo fc-cache -f
          fc-match "Noto Sans Bengali" | grep -qi "Noto Sans Bengali" || {
            echo "::error::Noto Sans Bengali font family is unavailable after installation"
            exit 1
          }
          ffmpeg -version
          ffprobe -version

      - name: Install pipeline dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --user --break-system-packages edge-tts
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          npm install --prefix scripts/pipeline --no-audit --no-fund pg@8.16.3

      - name: Claim one published article
        id: claim
        run: node scripts/pipeline/create-video-job.cjs

      - name: Render Bengali video
        run: node scripts/pipeline/generate-video.js "${{ steps.claim.outputs.article_id }}"

      - name: Upload and verify in private Supabase Storage
        env:
          ARTICLE_ID: ${{ steps.claim.outputs.article_id }}
          VIDEO_JOB_ID: ${{ steps.claim.outputs.video_job_id }}
          VIDEO_CLAIM_TOKEN: ${{ steps.claim.outputs.claim_token }}
          VIDEO_FILE: scripts/pipeline/output/video-${{ steps.claim.outputs.article_id }}
        shell: bash
        run: |
          set -euo pipefail
          VIDEO_FILE="scripts/pipeline/output/video-${ARTICLE_ID:0:8}.mp4"
          test -s "$VIDEO_FILE"
          export VIDEO_FILE
          node scripts/pipeline/upload-supabase-video.mjs

      - name: Mark claimed job failed on pipeline error
        if: failure() && steps.claim.outputs.video_job_id != ''
        env:
          VIDEO_JOB_ID: ${{ steps.claim.outputs.video_job_id }}
          VIDEO_CLAIM_TOKEN: ${{ steps.claim.outputs.claim_token }}
          FAILURE_REASON: "GitHub Actions render/upload step failed; inspect workflow logs"
        run: node scripts/pipeline/fail-video-job.cjs

      - name: Cleanup generated media
        if: always()
        run: rm -rf scripts/pipeline/tmp scripts/pipeline/output
