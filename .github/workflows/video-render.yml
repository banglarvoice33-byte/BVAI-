name: BVAI Reviewed Media Pipeline

on:
  workflow_dispatch:
    inputs:
      article_id:
        description: 'Published article UUID; blank selects latest eligible article'
        required: false
        type: string
      publish_mode:
        description: 'review hides media; website publishes site only; distribute adds selected outbox targets'
        type: choice
        default: review
        options: [review, website, distribute]
  schedule:
    # Ten editorially chosen coverage slots, NOT measured audience analytics.
    # UTC -> Dhaka: 07:17,09:17,11:17,12:17,13:17,15:17,17:17,19:17,21:17,23:17.
    - cron: '17 1,3,5,6,7,9,11,13,15,17 * * *'

concurrency:
  group: bvai-video-render
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  render-and-upload:
    if: github.event_name == 'workflow_dispatch' || (vars.ENABLE_VIDEO_AUTOMATION == 'true' && vars.BVAI_VIDEO_SCHEDULER_OWNER != 'termux')
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      VIDEO_RECOVERY_KEY: ${{ secrets.VIDEO_RECOVERY_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      TTS_SARVAM_1: ${{ secrets.TTS_SARVAM_1 }}
      TTS_SARVAM_2: ${{ secrets.TTS_SARVAM_2 }}
      TTS_SARVAM_3: ${{ secrets.TTS_SARVAM_3 }}
      TTS_SONEXLABS_1: ${{ secrets.TTS_SONEXLABS_1 }}
      TTS_SONEXLABS_2: ${{ secrets.TTS_SONEXLABS_2 }}
      TTS_SONEXLABS_3: ${{ secrets.TTS_SONEXLABS_3 }}
      TTS_CARTESIA_1: ${{ secrets.TTS_CARTESIA_1 }}
      TTS_CARTESIA_2: ${{ secrets.TTS_CARTESIA_2 }}
      TTS_ELEVENLABS_1: ${{ secrets.TTS_ELEVENLABS_1 }}
      TTS_ELEVENLABS_2: ${{ secrets.TTS_ELEVENLABS_2 }}
      TTS_ELEVENLABS_3: ${{ secrets.TTS_ELEVENLABS_3 }}
      TTS_ELEVENLABS_4: ${{ secrets.TTS_ELEVENLABS_4 }}
      TTS_ELEVENLABS_5: ${{ secrets.TTS_ELEVENLABS_5 }}
      CARTESIA_VOICE_ID: ${{ secrets.CARTESIA_VOICE_ID }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      ARTICLE_ID: ${{ inputs.article_id }}
      VIDEO_PUBLISH_MODE: ${{ inputs.publish_mode || vars.VIDEO_PUBLISH_MODE || 'review' }}
      VIDEO_REQUIRE_CAPTIONS: 'true'
      EDGE_CAPTION_FALLBACK: 'true'
      VIDEO_DELIVERY_ENABLED: ${{ vars.VIDEO_DELIVERY_ENABLED || 'false' }}
      VIDEO_DELIVERY_PLATFORMS: ${{ vars.VIDEO_DELIVERY_PLATFORMS }}
      YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
      SOCIAL_FACEBOOK_PAGE_ID: ${{ vars.SOCIAL_FACEBOOK_PAGE_ID }}
      SOCIAL_INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ vars.SOCIAL_INSTAGRAM_BUSINESS_ACCOUNT_ID }}
      FACEBOOK_GRAPH_VERSION: ${{ vars.FACEBOOK_GRAPH_VERSION || 'v21.0' }}
      YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY || 'unlisted' }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      SOCIAL_FACEBOOK_PAGE_TOKEN: ${{ secrets.SOCIAL_FACEBOOK_PAGE_TOKEN }}
      SOCIAL_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.SOCIAL_INSTAGRAM_ACCESS_TOKEN }}
      VIDEO_DISTRIBUTION_WORKER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check required secrets
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_SERVICE_ROLE_KEY" || {
            echo '::error::Configure SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY'; exit 1;
          }
          # Optional paid TTS keys may be hydrated from Vault; matched Edge fallback is also supported.
          if [ -z "$GROQ_API_KEY" ]; then
            echo '::warning::GROQ_API_KEY empty in GitHub Secrets (Vault may still hydrate at runtime)'
          fi
      - name: Require a persistent encrypted-recovery key
        run: |
          test -n "$VIDEO_RECOVERY_KEY" || {
            echo '::error::Set VIDEO_RECOVERY_KEY once in GitHub Secrets and keep an owner copy; ephemeral keys make recovery impossible'; exit 1;
          }
          node scripts/pipeline/protect-recovery.mjs --check-key
      - name: Install render tools and Bengali fonts
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg librsvg2-bin fonts-noto-core util-linux
          fc-match 'Noto Sans Bengali' || true
          python3 -m pip install --quiet edge-tts
          npm ci --no-audit --no-fund
      - name: Offline pipeline regression tests
        run: |
          set -euo pipefail
          node --check scripts/pipeline/generate-video.js
          node --check scripts/pipeline/delivery-providers.mjs
          npm run check:imports
          npm test
          npm run test:captions
      - name: Render, upload and optionally dispatch reviewed media
        run: bash run-bvai.sh
      - name: Keep non-secret diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bvai-media-diagnostics
          path: |
            logs/*.log
            temp_assets/receipt.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Encrypt interrupted render for recovery
        if: failure()
        run: node scripts/pipeline/protect-recovery.mjs
      - name: Keep encrypted private recovery artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bvai-encrypted-recovery-${{ github.run_id }}
          path: recovery.bvai.enc
          if-no-files-found: ignore
          retention-days: 3
