name: Video Render (manual, budget-capped)

on:
  workflow_dispatch:
    inputs:
      text:
        description: "Narration text (Bengali or English)"
        required: true
        type: string
      voice:
        description: "Microsoft Edge TTS voice"
        required: true
        default: "bn-BD-NabanitaNeural"
        type: choice
        options:
          - bn-BD-NabanitaNeural
          - bn-BD-PradeepNeural
          - en-US-AriaNeural
      title:
        description: "Optional video title"
        required: false
        default: "Banglar Voice"
        type: string

# Manual dispatch only: no push/PR auto-runs. One job at a time, bounded runtime.
concurrency:
  group: video-render-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render:
    name: Render short video
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg, Python and Bengali fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg python3 python3-pip fonts-noto-bengali
          ffmpeg -version
          python3 --version

      - name: Install Edge TTS
        run: python3 -m pip install --user --break-system-packages edge-tts

      - name: Generate narration and render MP4
        env:
          NARRATION_TEXT: ${{ inputs.text }}
          TTS_VOICE: ${{ inputs.voice }}
          VIDEO_TITLE: ${{ inputs.title }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python3 - <<'PY'
          import asyncio, os, re, subprocess
          from pathlib import Path
          import edge_tts

          text = os.environ["NARRATION_TEXT"].strip()
          voice = os.environ["TTS_VOICE"].strip()
          title = os.environ["VIDEO_TITLE"].strip() or "Banglar Voice"
          if not text or len(text) > 5000:
              raise SystemExit("Narration must contain 1–5000 characters.")
          if len(title) > 120:
              raise SystemExit("Title must be 120 characters or fewer.")
          audio = Path("output/narration.mp3")
          async def synthesize():
              await edge_tts.Communicate(text, voice).save(str(audio))
          asyncio.run(synthesize())

          # Render a portrait social-video canvas with Bengali-capable Noto fonts.
          # Escape drawtext special characters; user input is never shell-evaluated.
          def escape_drawtext(value):
              return value.replace("\\", r"\\").replace(":", r"\\:").replace("'", r"\\'").replace("%", r"\\%").replace(",", r"\\,").replace("[", r"\\[").replace("]", r"\\]").replace("\n", " ")
          Path("output/title.txt").write_text(title, encoding="utf-8")
          # ffmpeg drawtext reads text from a file, avoiding command-line interpolation.
          title_filter = "drawtext=fontfile=/usr/share/fonts/truetype/noto/NotoSansBengali-Regular.ttf:textfile=output/title.txt:fontcolor=white:fontsize=54:x=(w-text_w)/2:y=h*0.18:box=1:boxcolor=black@0.35:boxborderw=24"
          cmd = [
              "ffmpeg", "-hide_banner", "-y",
              "-f", "lavfi", "-i", "color=c=0x10243a:s=1080x1920:r=30",
              "-i", str(audio),
              "-vf", title_filter,
              "-c:v", "libx264", "-preset", "veryfast", "-crf", "25",
              "-c:a", "aac", "-b:a", "128k",
              "-shortest", "-pix_fmt", "yuv420p",
              "-movflags", "+faststart", "output/bvai-video.mp4"
          ]
          subprocess.run(cmd, check=True)
          if not Path("output/bvai-video.mp4").is_file() or Path("output/bvai-video.mp4").stat().st_size < 1024:
              raise SystemExit("Render output is missing or unexpectedly small.")
          PY

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: bvai-rendered-video
          path: output/bvai-video.mp4
          if-no-files-found: error
          retention-days: 7
