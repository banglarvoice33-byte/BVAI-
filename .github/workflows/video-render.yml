name: BVAI Website Video Pipeline

on:
  workflow_dispatch:
    inputs:
      article_id:
        description: 'Published article UUID; blank selects latest eligible article'
        required: false
        type: string
      publish_mode:
        description: 'website publishes only to site; review keeps video hidden'
        type: choice
        default: review
        options: [review, website]
  schedule:
    # Existing daily slot, gated OFF until repository variable is explicitly set.
    - cron: '0 3 * * *'

concurrency:
  group: bvai-video-render
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  render-and-upload:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_VIDEO_AUTOMATION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      TTS_SARVAM_1: ${{ secrets.TTS_SARVAM_1 }}
      TTS_SARVAM_2: ${{ secrets.TTS_SARVAM_2 }}
      TTS_SARVAM_3: ${{ secrets.TTS_SARVAM_3 }}
      TTS_SONEXLABS_1: ${{ secrets.TTS_SONEXLABS_1 }}
      TTS_SONEXLABS_2: ${{ secrets.TTS_SONEXLABS_2 }}
      TTS_SONEXLABS_3: ${{ secrets.TTS_SONEXLABS_3 }}
      TTS_CARTESIA_1: ${{ secrets.TTS_CARTESIA_1 }}
      TTS_CARTESIA_2: ${{ secrets.TTS_CARTESIA_2 }}
      TTS_ELEVENLABS_1: ${{ secrets.TTS_ELEVENLABS_1 }}
      TTS_ELEVENLABS_2: ${{ secrets.TTS_ELEVENLABS_2 }}
      TTS_ELEVENLABS_3: ${{ secrets.TTS_ELEVENLABS_3 }}
      TTS_ELEVENLABS_4: ${{ secrets.TTS_ELEVENLABS_4 }}
      TTS_ELEVENLABS_5: ${{ secrets.TTS_ELEVENLABS_5 }}
      CARTESIA_VOICE_ID: ${{ secrets.CARTESIA_VOICE_ID }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      ARTICLE_ID: ${{ inputs.article_id }}
      VIDEO_PUBLISH_MODE: ${{ inputs.publish_mode || 'website' }}
      VIDEO_REQUIRE_CAPTIONS: 'true'
      SOCIAL_AUTOMATION_ENABLED: 'false'
      VIDEO_DISTRIBUTION_WORKER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check required secrets
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_SERVICE_ROLE_KEY" && test -n "$GROQ_API_KEY" || {
            echo '::error::Configure SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY and GROQ_API_KEY'; exit 1;
          }
          test -n "$TTS_SARVAM_1$TTS_CARTESIA_1$TTS_ELEVENLABS_1$TTS_SONEXLABS_1" || {
            echo '::error::Configure at least one primary TTS provider secret'; exit 1;
          }
      - name: Install render tools and Bengali fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg librsvg2-bin fonts-noto-core util-linux
          fc-match 'Noto Sans Bengali'
          python3 -m pip install edge-tts
          npm ci --no-audit --no-fund
      - name: Offline pipeline regression tests
        run: |
          node --test scripts/pipeline/tests/*.test.mjs
          python3 -m unittest discover -s scripts/pipeline/tests -p 'test_*.py'
      - name: Render and publish to website only
        run: bash run-bvai.sh
      - name: Keep non-secret diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bvai-website-diagnostics
          path: |
            logs/*.log
            temp_assets/receipt.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Mark unfinished claim failed on runner failure
        if: failure()
        run: node scripts/pipeline/fail-claim.mjs
