name: BVAI Supabase DB Pull

on:
  workflow_dispatch:

jobs:
  pull:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Pull remote schema as migration
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db pull --remote
          git status --short
      - name: Commit pulled migration if any
        run: |
          git config user.name "bvaisync"
          git config user.email "bvaisync@users.noreply.github.com"
          git add supabase/migrations
          if git diff --cached --quiet; then
            echo "NO_NEW_MIGRATION"
          else
            git commit -m "chore: pull remote-only migrations from Supabase"
            git push
          fi
