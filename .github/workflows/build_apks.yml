name: Build BV APKs - Banglar Voice Release Signed
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile_monorepo/**']
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: reader_app
            target: lib/main.dart
          - app: admin_app
            target: lib/main_admin.dart
          - app: reporter_app
            target: lib/main.dart
          - app: studio_app
            target: lib/main_studio.dart
          - app: tv_app
            target: lib/main_tv.dart
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Decode Banglar Voice keystore
        run: |
          mkdir -p mobile_monorepo/apps/${{ matrix.app }}/android/app/keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > mobile_monorepo/apps/${{ matrix.app }}/android/app/keystore/banglar-voice-release.jks
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > mobile_monorepo/apps/${{ matrix.app }}/android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> mobile_monorepo/apps/${{ matrix.app }}/android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> mobile_monorepo/apps/${{ matrix.app }}/android/key.properties
          echo "storeFile=keystore/banglar-voice-release.jks" >> mobile_monorepo/apps/${{ matrix.app }}/android/key.properties
      - name: Build APK - ${{ matrix.app }}
        working-directory: mobile_monorepo/apps/${{ matrix.app }}
        run: flutter build apk --release --split-per-abi --target ${{ matrix.target }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: mobile_monorepo/apps/${{ matrix.app }}/build/app/outputs/flutter-apk/*.apk
