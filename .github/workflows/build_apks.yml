name: Build BV APKs - Banglar Voice Release Signed
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile_monorepo/**']

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: reader_app
            target: lib/main.dart
          - app: admin_app
            target: lib/main_admin.dart
          - app: reporter_app
            target: lib/main.dart
          - app: studio_app
            target: lib/main_studio.dart
          - app: tv_app
            target: lib/main_tv.dart

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      GRADLE_OPTS: >-
        -Dorg.gradle.internal.repository.max.retries=5
        -Dorg.gradle.internal.repository.initial.backoff=1000

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Mirror Maven Central (keep Gradle Plugin Portal)
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/maven-central-mirror.gradle" << 'EOF'
          def central = ~/^https:\/\/(repo\.maven\.apache\.org|repo1\.maven\.org)\/maven2\/?/
          def mirror = 'https://maven-central.storage-download.googleapis.com/maven2/'
          def fallback = 'mavenCentralBehindMirror'

          def addFallback = { RepositoryHandler repositories ->
              repositories.maven {
                  name = fallback
                  url = 'https://repo.maven.apache.org/maven2/'
              }
          }

          def toMirror = { RepositoryHandler repositories ->
              def hasFallback = false
              repositories.all { repository ->
                  if (repository.name == fallback) { return }
                  if (repository instanceof MavenArtifactRepository) {
                      def url = repository.url.toString()
                      if (url =~ central) {
                          repository.url = url.replaceFirst(central, mirror)
                          if (!hasFallback) {
                              hasFallback = true
                              addFallback(repositories)
                              return
                          }
                      }
                  }
              }
              def last = repositories.findByName(fallback)
              if (hasFallback && !repositories.last().is(last)) {
                  repositories.remove(last)
                  repositories.add(last)
              }
          }

          beforeSettings { settings ->
              toMirror(settings.buildscript.repositories)
              toMirror(settings.pluginManagement.repositories)
              toMirror(settings.dependencyResolutionManagement.repositories)
          }

          settingsEvaluated { settings ->
              if (settings.pluginManagement.repositories.isEmpty()) {
                  settings.pluginManagement.repositories { repositories ->
                      maven { url = mirror }
                      addFallback(repositories)
                      gradlePluginPortal()
                  }
              }
          }

          allprojects { project ->
              toMirror(project.buildscript.repositories)
              toMirror(project.repositories)
          }
          EOF

      - name: Decode Banglar Voice keystore
        run: |
          mkdir -p mobile_monorepo/apps/${{ matrix.app }}/android/app/keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > mobile_monorepo/apps/${{ matrix.app }}/android/app/keystore/banglar-voice-release.jks
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > mobile_monorepo/apps/${{ matrix.app }}/android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> mobile_monorepo/apps/${{ matrix.app }}/android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> mobile_monorepo/apps/${{ matrix.app }}/android/key.properties
          echo "storeFile=app/keystore/banglar-voice-release.jks" >> mobile_monorepo/apps/${{ matrix.app }}/android/key.properties

      - name: Verify keystore exists
        run: |
          ls -l mobile_monorepo/apps/${{ matrix.app }}/android/app/keystore/
          ls -l mobile_monorepo/apps/${{ matrix.app }}/android/key.properties

      - name: Build APK - ${{ matrix.app }}
        working-directory: mobile_monorepo/apps/${{ matrix.app }}
        run: flutter build apk --release --split-per-abi --target=${{ matrix.target }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: mobile_monorepo/apps/${{ matrix.app }}/build/app/outputs/flutter-apk/*.apk
