name: BVAI Video Pipeline CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/video-pipeline-ci.yml"
      - ".github/workflows/video-render.yml"
      - "scripts/pipeline/**"
      - "supabase/functions/video-upload-authorize/**"
      - "supabase/migrations/*video_pipeline*"
  pull_request:
    paths:
      - ".github/workflows/video-render.yml"
      - "scripts/pipeline/**"
      - "supabase/functions/video-upload-authorize/**"
      - "supabase/migrations/*video_pipeline*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/pipeline/create-video-job.cjs
          node --check scripts/pipeline/fail-video-job.cjs
          node --check scripts/pipeline/generate-video.js
          node --check scripts/pipeline/upload-supabase-video.mjs
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install offline test tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Regression tests
        run: |
          node --test scripts/pipeline/tests/*.test.mjs
          python3 -m unittest discover -s scripts/pipeline/tests -p 'test_*.py'
      - name: Validate website-only transaction contract
        run: |
          grep -q "claim_video_generation_job" scripts/pipeline/generate-video.js
          grep -q "finalize_website_video" scripts/pipeline/upload-supabase-video.mjs
          grep -q "FOR UPDATE OF a SKIP LOCKED" supabase/migrations/20261109060000_website_only_video_delivery.sql
