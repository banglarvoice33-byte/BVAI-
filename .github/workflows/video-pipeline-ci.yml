name: BVAI Video Pipeline CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/video-render.yml"
      - "scripts/pipeline/**"
      - "supabase/functions/video-upload-authorize/**"
      - "supabase/migrations/*video_pipeline*"
  pull_request:
    paths:
      - ".github/workflows/video-render.yml"
      - "scripts/pipeline/**"
      - "supabase/functions/video-upload-authorize/**"
      - "supabase/migrations/*video_pipeline*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/pipeline/create-video-job.cjs
          node --check scripts/pipeline/fail-video-job.cjs
          node --check scripts/pipeline/generate-video.js
          node --check scripts/pipeline/upload-supabase-video.mjs
      - name: Validate required transactional contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q "claim_video_generation_job" scripts/pipeline/create-video-job.cjs
          grep -q "finalize_video_generation_job" supabase/functions/video-upload-authorize/index.ts
          grep -q "x-video-claim-token" scripts/pipeline/upload-supabase-video.mjs
          grep -q "FOR UPDATE OF a SKIP LOCKED" supabase/migrations/20261108012807_harden_video_pipeline_transactions.sql
          grep -q "video_generation_assets_job_kind_uidx" supabase/migrations/20261108012807_harden_video_pipeline_transactions.sql
