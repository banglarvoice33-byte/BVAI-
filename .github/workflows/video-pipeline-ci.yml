name: BVAI Video Pipeline CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/video-pipeline-ci.yml"
      - ".github/workflows/video-render.yml"
      - "scripts/pipeline/**"
      - "package*.json"
      - "supabase/migrations/20261111*.sql"
      - "supabase/functions/video-upload-authorize/**"
      - "supabase/migrations/*video_pipeline*"
      - "supabase/migrations/*media_delivery*"
      - "supabase/migrations/*render_heartbeat*"
  pull_request:
    paths:
      - ".github/workflows/video-render.yml"
      - "scripts/pipeline/**"
      - "package*.json"
      - "supabase/migrations/20261111*.sql"
      - "supabase/functions/video-upload-authorize/**"
      - "supabase/migrations/*video_pipeline*"
      - "supabase/migrations/*media_delivery*"
      - "supabase/migrations/*render_heartbeat*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04 # pinned: ffmpeg 6.1.1 is what the render contract was validated on (ubuntu-latest is moving to Ubuntu 26)
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/pipeline/create-video-job.cjs
          node --check scripts/pipeline/fail-video-job.cjs
          node --check scripts/pipeline/generate-video.js
          node --check scripts/pipeline/upload-supabase-video.mjs
          for f in video-contract render-heartbeat video-compose video-script media-sources audio-qc source-evidence delivery-worker delivery-providers; do node --check "scripts/pipeline/$f.mjs"; done
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install offline test tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg librsvg2-bin fonts-noto-core
      - name: Regression tests
        run: |
          npm run check:imports
          npm test
          python3 -m unittest discover -s scripts/pipeline/tests -p 'test_*.py'
      - name: Offline forty-second render smoke
        env:
          VIDEO_ENCODER_PRESET: ultrafast
        run: node scripts/pipeline/tests/render-smoke.mjs
      - name: Offline end-to-end renderer (fake DB/TTS/media; asserts contract + asset deletion)
        env:
          VIDEO_PRESET: ultrafast
        run: node scripts/pipeline/tests/pipeline-e2e.mjs
      - name: Validate transactional media contract
        run: |
          grep -q "claim_reviewed_video_job" scripts/pipeline/generate-video.js
          grep -q "finalize_media_delivery" scripts/pipeline/upload-supabase-video.mjs
          grep -q "FOR UPDATE OF a SKIP LOCKED" supabase/migrations/20261109060000_website_only_video_delivery.sql

  database-contract:
    runs-on: ubuntu-24.04 # pinned: ffmpeg 6.1.1 is what the render contract was validated on (ubuntu-latest is moving to Ubuntu 26)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bvai_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bvai_ci_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
      - run: npm ci --no-audit --no-fund
      - name: Apply isolated test fixture and exact baseline/new migrations
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client
          psql -h localhost -U postgres -d bvai_ci_test -X -v ON_ERROR_STOP=1 \
            -f scripts/pipeline/tests/media-contract-bootstrap.sql \
            -f supabase/migrations/20261108000000_add_public_media_tables_and_service_role_policies.sql \
            -f supabase/migrations/20261108010000_reconcile_video_generation_jobs_and_assets.sql \
            -f supabase/migrations/20261108012807_harden_video_pipeline_transactions.sql \
            -f supabase/migrations/20261109060000_website_only_video_delivery.sql \
            -f supabase/migrations/20261110000000_media_delivery_reliability.sql \
            -f supabase/migrations/20261110000000_media_delivery_reliability.sql \
            -f scripts/pipeline/tests/media-contract.test.sql \
            -f scripts/pipeline/deployment-preflight.sql \
            -f scripts/pipeline/tests/repair-bootstrap.sql \
            -f supabase/migrations/20261110233227_trusted_source_video_gate.sql \
            -f supabase/migrations/20261111030000_dhaka_business_hours_cadence.sql \
            -f supabase/migrations/20261111040000_restore_social_dispatch_contract.sql \
            -f supabase/migrations/20261111041000_media_capacity_and_cadence_boundaries.sql \
            -f scripts/pipeline/tests/repair-contract.test.sql \
            -f supabase/migrations/20261113000000_render_heartbeat_fencing.sql \
            -f supabase/migrations/20261113000000_render_heartbeat_fencing.sql \
            -f scripts/pipeline/tests/render-heartbeat.test.sql
      - name: Test two-session claim race
        run: node scripts/pipeline/tests/database-concurrency.mjs
