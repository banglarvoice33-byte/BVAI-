name: render-healthcheck
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render API
        run: |
          test -n "${{ secrets.RENDER_API_URL }}" || { echo "RENDER_API_URL secret missing"; exit 1; }
          curl -fsS "${{ secrets.RENDER_API_URL }}/health" | grep -q '"ok":true'
          echo "OK"
