name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: reader_app
            target: lib/main.dart
          - app: admin_app
            target: lib/main_admin.dart
          - app: reporter_app
            target: lib/main.dart
          - app: studio_app
            target: lib/main_studio.dart
          - app: tv_app
            target: lib/main.dart
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build APK
        working-directory: mobile_monorepo/apps/${{ matrix.app }}
        run: |
          flutter pub get
          flutter build apk --release -t ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: mobile_monorepo/apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
