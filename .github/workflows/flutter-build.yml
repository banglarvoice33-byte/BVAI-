name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: reader_app
            target: lib/main.dart
          - app: admin_app
            target: lib/main_admin.dart
          - app: reporter_app
            target: lib/main.dart
          - app: studio_app
            target: lib/main_studio.dart
          - app: tv_app
            target: lib/main.dart
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile_monorepo/apps/${{ matrix.app }}/android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Diagnose versions
        run: |
          flutter --version
          java -version
      - name: Analyze - report only, do not block build yet
        working-directory: mobile_monorepo/apps/${{ matrix.app }}
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        working-directory: mobile_monorepo/apps/${{ matrix.app }}
        run: flutter test || echo "NO_TESTS"
      - name: Build APK
        working-directory: mobile_monorepo/apps/${{ matrix.app }}
        run: |
          flutter pub get
          flutter build apk --release -t ${{ matrix.target }} --split-per-abi
          ls -lh build/app/outputs/flutter-apk/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: mobile_monorepo/apps/${{ matrix.app }}/build/app/outputs/flutter-apk/*.apk
