name: Render Video (BVAI)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg + edge-tts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q edge-tts

      - name: Install JS deps
        run: npm ci --prefix frontend

      - name: Render video
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TTS_SARVAM_1: ${{ secrets.TTS_SARVAM_1 }}
          TTS_SARVAM_2: ${{ secrets.TTS_SARVAM_2 }}
          TTS_SARVAM_3: ${{ secrets.TTS_SARVAM_3 }}
          TTS_CARTESIA_1: ${{ secrets.TTS_CARTESIA_1 }}
          TTS_CARTESIA_2: ${{ secrets.TTS_CARTESIA_2 }}
          TTS_ELEVENLABS_1: ${{ secrets.TTS_ELEVENLABS_1 }}
          TTS_ELEVENLABS_2: ${{ secrets.TTS_ELEVENLABS_2 }}
          TTS_ELEVENLABS_3: ${{ secrets.TTS_ELEVENLABS_3 }}
          TTS_ELEVENLABS_4: ${{ secrets.TTS_ELEVENLABS_4 }}
          TTS_ELEVENLABS_5: ${{ secrets.TTS_ELEVENLABS_5 }}
          TTS_SONEXLABS_1: ${{ secrets.TTS_SONEXLABS_1 }}
          TTS_SONEXLABS_2: ${{ secrets.TTS_SONEXLABS_2 }}
          TTS_SONEXLABS_3: ${{ secrets.TTS_SONEXLABS_3 }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          CARTESIA_VOICE_ID: ${{ secrets.CARTESIA_VOICE_ID }}
        run: node scripts/pipeline/generate-video.js

      - name: Upload video to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TTS_SARVAM_1: ${{ secrets.TTS_SARVAM_1 }}
          TTS_SARVAM_2: ${{ secrets.TTS_SARVAM_2 }}
          TTS_SARVAM_3: ${{ secrets.TTS_SARVAM_3 }}
          TTS_CARTESIA_1: ${{ secrets.TTS_CARTESIA_1 }}
          TTS_CARTESIA_2: ${{ secrets.TTS_CARTESIA_2 }}
          TTS_ELEVENLABS_1: ${{ secrets.TTS_ELEVENLABS_1 }}
          TTS_ELEVENLABS_2: ${{ secrets.TTS_ELEVENLABS_2 }}
          TTS_ELEVENLABS_3: ${{ secrets.TTS_ELEVENLABS_3 }}
          TTS_ELEVENLABS_4: ${{ secrets.TTS_ELEVENLABS_4 }}
          TTS_ELEVENLABS_5: ${{ secrets.TTS_ELEVENLABS_5 }}
          TTS_SONEXLABS_1: ${{ secrets.TTS_SONEXLABS_1 }}
          TTS_SONEXLABS_2: ${{ secrets.TTS_SONEXLABS_2 }}
          TTS_SONEXLABS_3: ${{ secrets.TTS_SONEXLABS_3 }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          CARTESIA_VOICE_ID: ${{ secrets.CARTESIA_VOICE_ID }}
        run: node scripts/pipeline/upload-supabase-video.mjs
